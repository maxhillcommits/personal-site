<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus</title>
  
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: white;
    color: black;
  }
  #site {
    display: block;
    max-width: 640px;
    margin: 3em auto;
    padding: 0 1em;
    line-height: 1.6;
    font-size: 1.2em;
  }
  h1, h2 {
    margin-top: 1.5em;
  }
  p {
    margin: 1em 0;
  }
  a {
    color: blue;
    text-decoration: underline;
  }
  a:hover {
    text-decoration: none;
  }

  /* Responsive text scaling */
  @media (max-width: 640px) {
    #site {
      font-size: 0.9em;
    }
  }

  @media (max-width: 480px) {
    #site {
      font-size: 0.85em;
    }
  }
</style>

</head>
<body>
  <div id="site">

    <img src="img1.png" alt="img" style="width:640px; height:auto;">

    <p><strong>Don't you understand what's at stake?</strong></p>
    
    <p>Stop doing things that are unnecessary.</p>

    <p>What you consume shapes how you feel, think, and act. Engineer your inputs or someone else will. Don’t just drift along.</p>
    
  </div>
  
</body>
</html>
